<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>3D 2x2x2 立方体 - 全视角金属增强版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #F5F5DC; transition: background-color 0.8s ease; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        canvas { display: block; touch-action: none; }
        .ui { position: absolute; top: 15px; left: 15px; background: rgba(255,255,255,0.4); padding: 12px; border-radius: 8px; font-family: sans-serif; pointer-events: none; z-index: 100; }
    </style>
</head>
<body>
    <div class="ui">
        <b>全视角增强版：</b><br>
        • 点击方块：随机抽取颜色<br>
        • 稀有色：10秒同色粒子喷发 + 5秒背景联动
    </div>

    <script type="importmap">
        { "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }}
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 场景与相机 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xF5F5DC);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(7, 7, 10);
        
        const isMobile = window.matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ReinhardToneMapping; // 增强色彩表现
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = isMobile ? 0.12 : 0.08;
        controls.rotateSpeed = isMobile ? 0.9 : 1.0;
        controls.zoomSpeed = isMobile ? 1.2 : 1.0;
        controls.enablePan = false;
        controls.touches = {
            ONE: THREE.TOUCH.ROTATE,
            TWO: THREE.TOUCH.DOLLY_ROTATE
        };

        // --- 核心光照 (修改1：多光源保证全方位亮度) ---
        scene.add(new THREE.AmbientLight(0xffffff, 1.2)); // 极强的环境光
        const light1 = new THREE.PointLight(0xffffff, 50);
        light1.position.set(10, 10, 10);
        scene.add(light1);
        const light2 = new THREE.PointLight(0xffffff, 50);
        light2.position.set(-10, -10, -10);
        scene.add(light2);

        // --- 颜色配置 ---
        const colorWeights = [
            { name: 'black', hex: 0x111111, chance: 0.30, metal: false },
            { name: 'white', hex: 0xffffff, chance: 0.30, metal: false },
            { name: 'blue',  hex: 0x0044FF, chance: 0.10, metal: false },
            { name: 'green', hex: 0x00FF44, chance: 0.10, metal: false },
            { name: 'red',   hex: 0xFF2200, chance: 0.10, metal: false },
            { name: 'copper', hex: 0xB87333, chance: 0.04, metal: true, rare: true },
            { name: 'silver', hex: 0xC0C0C0, chance: 0.03, metal: true, rare: true },
            { name: 'gold',   hex: 0xFFD700, chance: 0.02, metal: true, rare: true },
            { name: 'rainbow', hex: 0xffffff, chance: 0.01, metal: true, rare: true, isRainbow: true }
        ];

        // --- 粒子系统 ---
        let particles = [];
        const MAX_PARTICLES = isMobile ? 700 : 1800;
        const particleGeometry = new THREE.SphereGeometry(0.06, isMobile ? 5 : 6, isMobile ? 5 : 6);
        function spawnParticle(pos, color, speedScale = 1) {
            if (particles.length >= MAX_PARTICLES) return;
            const p = new THREE.Mesh(
                particleGeometry,
                new THREE.MeshBasicMaterial({ color: color, transparent: true })
            );
            p.position.copy(pos);
            p.userData.vel = new THREE.Vector3(
                (Math.random()-0.5)*0.25*speedScale, 
                (Math.random()-0.5)*0.25*speedScale, 
                (Math.random()-0.5)*0.25*speedScale
            );
            p.userData.life = 1.0;
            scene.add(p);
            particles.push(p);
        }

        // --- 音效逻辑 (竖琴) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playHarp(isRare) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            if (isRare) {
                [523, 659, 783, 1046].forEach((f, i) => {
                    const osc = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    osc.frequency.setValueAtTime(f, now + i * 0.1);
                    g.gain.setValueAtTime(0.15, now + i * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 1.5);
                    osc.connect(g).connect(audioCtx.destination);
                    osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 1.5);
                });
            } else {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.frequency.setValueAtTime(120, now);
                g.gain.setValueAtTime(0.2, now);
                g.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(g).connect(audioCtx.destination);
                osc.start(); osc.stop(now + 0.3);
            }
        }

        // --- 立方体 ---
        const cubes = [];
        const size = 2.4;
        const gap = 0.02;
        for (let i = 0; i < 8; i++) {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(size, size, size),
                new THREE.MeshStandardMaterial({ 
                    color: 0xffffff, transparent: true, opacity: 0.5, roughness: 0.5 
                })
            );
            mesh.position.set((i&1?1:-1)*(size/2+gap), (i&2?1:-1)*(size/2+gap), (i&4?1:-1)*(size/2+gap));
            mesh.userData = { isRainbow: false, emitterTimer: 0, currentColor: new THREE.Color(0xffffff) };
            scene.add(mesh);
            cubes.push(mesh);
        }

        // --- 点击/触摸交互（鼠标点击 + 单指轻触） ---
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let pointerDownInfo = null;
        let activeTouchCount = 0;
        const TAP_MOVE_THRESHOLD = isMobile ? 16 : 10;

        function triggerHaptic(isRare) {
            if (navigator.vibrate) {
                navigator.vibrate(isRare ? [20, 35, 20] : 15);
            }
        }

        function applyCubeInteraction(target) {
            const config = (() => {
                const r = Math.random(); let s = 0;
                for (const c of colorWeights) { s += c.chance; if (r < s) return c; }
                return colorWeights[0];
            })();

            target.userData.isRainbow = config.isRainbow;
            target.userData.currentColor.set(config.hex);

            // 修改1：增强材质，确保全角度可见金属感
            if (config.metal) {
                target.material.transparent = false;
                target.material.opacity = 1.0;
                target.material.metalness = 1.0;
                target.material.roughness = 0.05; // 非常光滑
                target.material.color.set(config.hex);
                // 核心：增加自发光颜色（Emissive），使颜色在暗处或背光处也清晰
                target.material.emissive.set(config.hex).multiplyScalar(0.2);
            } else {
                target.material.transparent = true;
                target.material.opacity = 0.6;
                target.material.metalness = 0;
                target.material.roughness = 0.5;
                target.material.color.set(config.hex);
                target.material.emissive.set(0x000000);
            }

            playHarp(config.rare);
            triggerHaptic(config.rare);

            if (config.rare) {
                target.userData.emitterTimer = 600; // 10秒持续

                // 修改3：背景变为相应颜色持续5秒
                const bgHex = config.isRainbow ? "#ff00ff" : `#${target.userData.currentColor.getHexString()}`;
                document.body.style.backgroundColor = bgHex;
                setTimeout(() => {
                    document.body.style.backgroundColor = "#F5F5DC";
                }, 5000);
            } else {
                const burstCount = isMobile ? 36 : 60;
                for(let i=0; i<burstCount; i++) spawnParticle(target.position, config.hex, 0.6);
            }
        }

        function pickCube(clientX, clientY) {
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(cubes);

            if (intersects.length > 0) {
                applyCubeInteraction(intersects[0].object);
            }
        }

        renderer.domElement.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'touch') activeTouchCount = 1;
            pointerDownInfo = { x: e.clientX, y: e.clientY, pointerType: e.pointerType, moved: false };
        }, { passive: true });

        renderer.domElement.addEventListener('pointermove', (e) => {
            if (!pointerDownInfo) return;
            const dx = e.clientX - pointerDownInfo.x;
            const dy = e.clientY - pointerDownInfo.y;
            if (Math.hypot(dx, dy) > TAP_MOVE_THRESHOLD) {
                pointerDownInfo.moved = true;
            }
        }, { passive: true });

        renderer.domElement.addEventListener('pointerup', (e) => {
            if (!pointerDownInfo) return;
            const isTap = !pointerDownInfo.moved && activeTouchCount < 2;
            if (isTap) {
                pickCube(e.clientX, e.clientY);
            }
            pointerDownInfo = null;
            if (e.pointerType === 'touch') activeTouchCount = 0;
        }, { passive: true });

        renderer.domElement.addEventListener('pointercancel', () => {
            pointerDownInfo = null;
            activeTouchCount = 0;
        }, { passive: true });

        renderer.domElement.addEventListener('touchstart', (e) => {
            activeTouchCount = e.touches.length;
            if (e.touches.length === 1) {
                const t = e.touches[0];
                pointerDownInfo = { x: t.clientX, y: t.clientY, pointerType: 'touch', moved: false };
            } else {
                pointerDownInfo = null;
            }
        }, { passive: true });

        renderer.domElement.addEventListener('touchmove', (e) => {
            activeTouchCount = e.touches.length;
            if (!pointerDownInfo || e.touches.length !== 1) return;
            const t = e.touches[0];
            const dx = t.clientX - pointerDownInfo.x;
            const dy = t.clientY - pointerDownInfo.y;
            if (Math.hypot(dx, dy) > TAP_MOVE_THRESHOLD) {
                pointerDownInfo.moved = true;
            }
        }, { passive: true });

        renderer.domElement.addEventListener('touchend', (e) => {
            const endedTouch = e.changedTouches && e.changedTouches[0];
            const isTap = endedTouch && pointerDownInfo && !pointerDownInfo.moved && activeTouchCount === 1;
            activeTouchCount = e.touches.length;
            if (isTap) {
                pickCube(endedTouch.clientX, endedTouch.clientY);
            }
            pointerDownInfo = null;
        }, { passive: true });

        renderer.domElement.addEventListener('touchcancel', () => {
            pointerDownInfo = null;
            activeTouchCount = 0;
        }, { passive: true });


// --- 动画 ---
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.002;

            // 粒子逻辑：修改2：粒子颜色随方块颜色实时变化
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.add(p.userData.vel);
                p.userData.life -= 0.012;
                p.material.opacity = p.userData.life;
                p.scale.setScalar(p.userData.life);
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }

            cubes.forEach(c => {
                // 持续发射粒子逻辑
                if (c.userData.emitterTimer > 0) {
                    const pColor = new THREE.Color();
                    if (c.userData.isRainbow) {
                        pColor.setHSL((time * 0.5) % 1, 0.8, 0.6);
                    } else {
                        pColor.copy(c.userData.currentColor);
                    }
                    // 每帧发射，修改2：粒子颜色与方块保持一致
                    for(let j=0; j< (isMobile ? 3 : 6); j++) spawnParticle(c.position, pColor, 1.8);
                    c.userData.emitterTimer--;
                }

                // 彩虹变色逻辑
                if (c.userData.isRainbow) {
                    const h = (time * 0.2) % 1;
                    c.material.color.setHSL(h, 0.7, 0.5);
                    c.material.emissive.setHSL(h, 0.7, 0.2);
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
